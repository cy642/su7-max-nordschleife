<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b151d"><title>北环竞速 · 小米车库 2.0</title>
<style>
:root{
  color-scheme:dark;
  --ink:#eef5f7;--muted:#93aab3;--aqua:#6be8e7;--accent:#6be8e7;
  --glass:rgba(8,19,28,.74);--glass-strong:rgba(9,21,31,.88);
  --line:rgba(175,216,224,.2);--line-bright:rgba(128,232,235,.46);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif
}
*{box-sizing:border-box}
body{margin:0;background:#0a141c;color:var(--ink);overflow:hidden}
#app{height:100dvh;min-height:260px;position:relative;isolation:isolate;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.shade{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 68% 64% at 48% 52%,transparent 32%,rgba(4,12,18,.68) 100%),
    linear-gradient(90deg,rgba(4,12,18,.82) 0%,rgba(6,16,24,.38) 28%,transparent 52%,rgba(5,14,22,.46) 76%,rgba(4,11,17,.84) 100%),
    linear-gradient(0deg,rgba(4,11,17,.82),transparent 24%,transparent 84%,rgba(5,13,20,.65))
}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .16s,border-color .16s,transform .12s,box-shadow .16s}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
button:disabled{cursor:wait;opacity:.5}
a{color:var(--aqua)}
[hidden]{display:none!important}

/* Header */
header{
  position:absolute;z-index:8;left:2.4%;right:2.4%;top:max(12px,env(safe-area-inset-top));
  min-height:38px;display:flex;align-items:center;gap:10px;pointer-events:none
}
header>*{pointer-events:auto}
.brandBox{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 9px;border-radius:10px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);flex:none}
.mark{width:30px;height:19px;display:inline-flex;gap:3px;align-items:center;transform:skew(-26deg);margin-left:3px}
.mark i{display:block;width:6px;height:15px;background:var(--accent);border-radius:1px}
.mark i:nth-child(2){height:22px}
.brand{font-weight:800;letter-spacing:.11em;font-size:14.5px;white-space:nowrap}
.verBadge{padding:2px 6px;border-radius:4px;background:rgba(107,232,231,.16);border:1px solid rgba(107,232,231,.42);color:var(--aqua);font:700 10px Consolas,monospace;letter-spacing:.08em}
.divider{height:16px;width:1px;background:var(--line)}
.micro,.mono{font-family:Consolas,"SFMono-Regular",monospace;font-variant-numeric:tabular-nums}
.micro{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.tools{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:nowrap;justify-content:flex-end}
.small{
  background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;color:#e0edf0;white-space:nowrap
}
@media(max-width:1120px){.appName,.divider{display:none}}
.small:hover,.seg:hover{background:rgba(36,66,78,.88);border-color:rgba(165,220,228,.4)}
.small[aria-pressed=true],.small.active{color:var(--aqua);border-color:var(--line-bright);background:rgba(20,56,66,.86)}
.dailyPill{border-color:rgba(255,190,104,.55);background:linear-gradient(135deg,rgba(62,40,18,.82),rgba(22,34,44,.86));color:#ffe2b3}
.dailyPill:hover{border-color:#ffd082;background:linear-gradient(135deg,rgba(90,56,22,.9),rgba(28,46,58,.92))}
.dailyPill.active{border-color:var(--aqua);color:var(--aqua);background:rgba(16,58,64,.88)}
.qualityControl,.quality{color:#dce7e7;background:var(--glass);border:1px solid var(--line);border-radius:8px;font:inherit}
.qualityControl{display:flex;align-items:center;gap:4px;padding-left:10px;font-size:12px;color:#aebfc6;backdrop-filter:blur(12px)}
.quality{padding:6px 5px;cursor:pointer}.qualityControl .quality{border:0;background:transparent;height:100%}
.racing .qualityControl,.racing #careerBtn,.racing #dailyBtn,.racing .brandBox{display:none}

/* Showroom Left Card: Vehicle, Performance, Paint & Tuning */
.garageInfo{
  position:absolute;z-index:5;left:2.4%;top:72px;bottom:72px;width:min(350px,31vw);
  display:flex;flex-direction:column;justify-content:center;pointer-events:none
}
.showroomCard{
  pointer-events:auto;background:var(--glass);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:14px;
  padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.45);
  max-height:100%;overflow-y:auto;scrollbar-width:thin
}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--accent);font:700 10px/1.2 Consolas,monospace;letter-spacing:.16em}
.eyebrow:before{content:"";display:block;width:20px;height:2px;background:var(--accent)}
.vehicleStrip{display:flex;gap:4px;margin:10px 0 12px;flex-wrap:wrap}
.vChip{
  flex:1 1 auto;min-width:54px;padding:5px 7px;border-radius:6px;font-size:11px;font-weight:600;
  background:rgba(16,36,46,.72);border:1px solid rgba(160,204,214,.16);color:#adc2c8;
  display:flex;align-items:center;justify-content:center;gap:5px
}
.vChip i{width:7px;height:7px;border-radius:50%;flex:none}
.vChip.on{background:rgba(36,74,88,.92);border-color:var(--aqua);color:#fff;box-shadow:0 0 12px rgba(107,232,231,.22)}
.vehiclePicker{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.make{font-size:12px;font-weight:600;letter-spacing:.12em;color:#99b6be}
.model{display:flex;align-items:baseline;gap:8px;font:800 clamp(32px,3.6vw,50px)/1 "Segoe UI",Arial,sans-serif;letter-spacing:-.05em;margin:3px 0 6px}
.model em{font-size:.54em;color:#97dde6;font-weight:400;letter-spacing:-.04em;font-style:italic}
.model em:empty{display:none}
#vehicle{position:absolute;inset:0;opacity:0;pointer-events:none}
.color{display:flex;align-items:center;gap:8px;font-size:13px;color:#dce9eb;margin-bottom:12px}
.swatch{width:11px;height:11px;background:#23bacf;display:inline-block;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.22)}
.color span:last-child{color:var(--muted);font:10px Consolas,monospace;letter-spacing:.12em;margin-left:auto}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid var(--line);padding-top:11px}
.statBox b{display:block;font:700 clamp(16px,1.5vw,21px)/1.1 Consolas,monospace;color:#f4fafb}
.statBox b small{font-size:.52em;color:#95b0b6;font-weight:500}
.statBox label{display:block;margin-top:3px;font-size:10px;color:var(--muted)}
.statBar{height:3px;background:rgba(150,190,200,.18);border-radius:2px;margin-top:5px;overflow:hidden}
.statBar i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),#a8fff5);border-radius:2px;transition:width .3s ease}

.customBlock{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.subLabel{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#9bb2b8;margin-bottom:6px}
.subLabel span{font-size:10px;color:var(--aqua)}
.paintBar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pDot{
  width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.22);padding:0;position:relative;
  box-shadow:inset 0 2px 4px rgba(255,255,255,.28)
}
.pDot.on{border-color:#fff;transform:scale(1.16);box-shadow:0 0 0 2px var(--aqua)}
.pDot[data-paint=stock]{background:conic-gradient(#17adce,#f6cd23,#8c1d37,#b4c2c7,#17adce)}
.tuneBar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.tChip{
  padding:6px 4px;border-radius:6px;background:rgba(15,34,44,.75);border:1px solid var(--line);
  font-size:11px;color:#b2c6cc;font-weight:600
}
.tChip.on{background:rgba(30,72,84,.92);border-color:var(--aqua);color:#fff}

/* Showroom Right Dock: Track Cards, Event, Weather, Launch */
.raceDock{
  position:absolute;z-index:5;right:2.4%;top:72px;bottom:72px;width:min(380px,34vw);
  display:flex;flex-direction:column;justify-content:center;pointer-events:none
}
.dockCard{
  pointer-events:auto;background:var(--glass);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:14px;
  padding:14px 16px;box-shadow:0 20px 60px rgba(0,0,0,.45);
  max-height:100%;overflow-y:auto;scrollbar-width:thin
}
.routeHead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.routeHead .rMeta{flex:1;min-width:0}
.routeHead strong{display:block;font-size:15px;letter-spacing:.03em}
.routeHead small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
#routeTrace{width:76px;height:36px;border-radius:6px;background:rgba(7,18,26,.7);border:1px solid var(--line);padding:3px}
.trackGrid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px
}
.tCard{
  text-align:left;padding:6px 7px;border-radius:8px;background:rgba(13,29,38,.76);
  border:1px solid rgba(160,204,214,.16);border-left:3px solid var(--c,var(--aqua));
  display:flex;flex-direction:column;gap:2px
}
.tCard:hover{background:rgba(28,54,66,.88)}
.tCard.on{background:rgba(26,64,78,.94);border-color:var(--c,var(--aqua));box-shadow:0 0 14px rgba(107,232,231,.18)}
.tCard b{font-size:11.5px;color:#edf5f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tCard span{font-size:9.5px;color:#99b3bb;display:flex;justify-content:space-between;gap:4px}
.tCard.disabled{opacity:.42;pointer-events:none}
#route{display:none}

.race-options{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-bottom:8px}
.race-options label,#sectorField{display:grid;gap:3px;color:#aac0c6;font-size:11px}
.race-options select,#sectorField select{
  width:100%;padding:7px 9px;border:1px solid rgba(135,180,192,.35);border-radius:7px;
  background:#112632;color:#eef7f8;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer
}
.race-options select option,.race-options optgroup{background:#10232e;color:#eef7f8}
.weatherRow{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.weatherRow>span{font-size:11px;color:#aac0c6;margin-right:2px;white-space:nowrap}
.wChip{
  flex:1;padding:5px 4px;border-radius:7px;background:rgba(14,30,40,.75);border:1px solid var(--line);
  font-size:11px;color:#b7cbd0;white-space:nowrap
}
.wChip.on{background:rgba(32,74,88,.94);border-color:var(--aqua);color:#fff}

.segments{display:flex;border:1px solid var(--line);background:rgba(9,22,30,.78);border-radius:8px;padding:3px;gap:3px;margin-bottom:8px}
.seg{background:transparent;flex:1;color:var(--muted);padding:7px 4px;font-size:11.5px;font-weight:600;border-radius:6px}
.seg.on{background:rgba(46,84,98,.92);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.seg span{font:10px Consolas,monospace;color:#a5c7ce;margin-left:3px}

#challengeBrief{
  margin:0 0 9px;padding:7px 10px;border-radius:8px;background:rgba(12,32,42,.74);
  border-left:2px solid var(--accent);color:#d7eaed;font-size:11.5px;line-height:1.45
}
.launchActions{display:flex;gap:7px}
.go{
  flex:1;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#6be8e7,#34cfca);color:#042026;
  border-radius:9px;padding:11px 16px;font-weight:800;font-size:14.5px;
  box-shadow:0 8px 28px rgba(72,222,220,.32)
}
.go:hover{background:linear-gradient(135deg,#99faf4,#58e3dd);transform:translateY(-1px)}
.go b{font-size:18px;line-height:1}

/* Bottom Showroom Footer */
.garageFoot{
  position:absolute;z-index:5;bottom:max(16px,env(safe-area-inset-bottom));left:2.4%;right:2.4%;
  display:flex;align-items:center;justify-content:space-between;pointer-events:none
}
.trackTag{border-left:3px solid var(--accent);padding:3px 12px;background:var(--glass);backdrop-filter:blur(12px);border-radius:0 8px 8px 0}
.trackTag strong{display:block;font-size:14px;letter-spacing:.04em}
.trackTag .micro{font-size:10px;line-height:1.6}
.actions{display:flex;gap:7px;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.hint{font-size:11.5px;color:#b2c8cd;background:rgba(9,20,28,.62);padding:5px 10px;border-radius:6px}
#appUpdate{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
#appUpdate.available{color:#bffff8;border-color:var(--aqua);background:#153b40}
.cabinPreview #garageInfo,.cabinPreview #raceDock,.cabinPreview #shade,.cabinPreview #garageWing,.cabinPreview .trackTag,.cabinPreview .dragHint,.cabinPreview #orbitToggle{display:none}
.cabinPreview .garageFoot{justify-content:flex-end}

/* Racing HUD */
.hud{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(5,14,20,.65),transparent 20%,transparent 82%,rgba(5,14,20,.5))}
.speedWarp{
  position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;
  background:radial-gradient(ellipse 70% 65% at 50% 50%,transparent 54%,rgba(107,232,231,.22) 92%,rgba(107,232,231,.42) 100%)
}
.speedWarp.boost{
  background:radial-gradient(ellipse 66% 62% at 50% 50%,transparent 48%,rgba(255,156,74,.26) 88%,rgba(255,108,46,.52) 100%)
}
.progress{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),#a8fff6);box-shadow:0 0 12px var(--accent);width:0}
.hudTop{position:absolute;top:max(16px,env(safe-area-inset-top));left:2.4%;display:flex;gap:6px}
.panel{
  padding:8px 14px;background:var(--glass-strong);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-left:3px solid rgba(130,175,185,.45);border-radius:9px;min-width:96px
}
.panel:first-child{border-left-color:var(--accent)}
.panel b{display:block;font:700 22px/1.15 Consolas,monospace}
.panel small{font-size:10px;color:#9eb8be;letter-spacing:.08em}
.panel .urgent{color:#ff9e78}
#position.behind{color:#ffae82}#position.ahead{color:#8dffc8}

.cornerHint{
  position:absolute;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);
  border-radius:9px;border:1px solid rgba(255,204,116,.5);border-bottom:3px solid #f5ba5e;
  background:rgba(12,24,33,.88);backdrop-filter:blur(12px);padding:6px 15px;
  font-size:13.5px;font-weight:700;color:#ffe2b0;white-space:nowrap;box-shadow:0 8px 26px rgba(0,0,0,.35)
}
.driftHud{
  position:absolute;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 46px));transform:translateX(-50%);
  padding:7px 16px;border-radius:10px;background:rgba(18,16,38,.86);backdrop-filter:blur(12px);
  border:1px solid rgba(255,134,92,.6);text-align:center;min-width:168px;
  box-shadow:0 10px 30px rgba(255,102,52,.22)
}
.driftTop{display:flex;align-items:baseline;justify-content:center;gap:8px}
.driftTag{font:800 11px Consolas,monospace;letter-spacing:.16em;color:#ff9c6e}
#driftPts{font:800 24px/1 Consolas,monospace;color:#fff}
#driftMult{font:800 15px/1 Consolas,monospace;color:#ffd066}
.driftBarTrack{height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:5px;overflow:hidden}
#driftBar{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6e42,#ffd166)}

.mapbox{
  position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:2.4%;width:196px;
  padding:10px 12px 9px;background:var(--glass-strong);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.35)
}
#mini{display:block;width:100%;height:94px}
.mapFoot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.mapbox strong{font-size:12.5px}
.mapbox .micro{font-size:9.5px;margin-top:1px}
#weatherHud{font-size:11px;padding:2px 6px;border-radius:5px;background:rgba(120,175,190,.16);color:#d7edf2;white-space:nowrap}

/* Modern Instrument Cluster */
.telemetry{
  position:absolute;right:2.4%;bottom:max(20px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:flex-end;gap:6px
}
.draftBadge{
  display:inline-block;padding:3px 10px;border-radius:6px;
  background:linear-gradient(135deg,rgba(98,58,196,.88),rgba(42,102,168,.88));
  border:1px solid rgba(196,168,255,.65);color:#f0e6ff;
  font:700 11px Consolas,monospace;letter-spacing:.1em;box-shadow:0 4px 18px rgba(134,88,255,.35)
}
.clusterCard{
  display:flex;align-items:center;gap:12px;padding:10px 16px 10px 14px;border-radius:14px;
  background:var(--glass-strong);backdrop-filter:blur(14px);border:1px solid var(--line);
  box-shadow:0 14px 36px rgba(0,0,0,.4)
}
.gMeter{
  position:relative;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle,rgba(107,232,231,.14),rgba(10,24,34,.85));
  border:1px solid rgba(145,195,205,.32);flex:none
}
.gMeter:before,.gMeter:after{content:"";position:absolute;background:rgba(145,195,205,.22)}
.gMeter:before{left:50%;top:4px;bottom:4px;width:1px}
.gMeter:after{top:50%;left:4px;right:4px;height:1px}
#gDot{
  position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;
  background:var(--aqua);box-shadow:0 0 8px var(--aqua);transform:translate(-50%,-50%)
}
.speedDial{position:relative;min-width:136px;text-align:right}
.arcGauge{display:block;width:136px;height:22px;overflow:visible;margin-bottom:-4px}
.speed{font:800 italic clamp(44px,5vw,66px)/.95 "Segoe UI",Arial,sans-serif;letter-spacing:-.05em;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.speedunit{font-size:11.5px;letter-spacing:.16em;color:#b7d4d8;white-space:nowrap;margin-top:2px}
#gear{display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(107,232,231,.18);color:var(--aqua);margin-right:4px;font-weight:800}
#gear.reverse{background:rgba(255,180,104,.22);color:#ffbd78}
.power{height:4px;width:136px;background:rgba(120,160,170,.28);border-radius:3px;margin:6px 0 0 auto;overflow:hidden}
.power i{display:block;height:100%;background:var(--aqua);width:0;border-radius:3px}
.hudActions{display:flex;gap:5px;justify-content:flex-end;pointer-events:auto;flex-wrap:wrap}
#driveTools{display:flex;gap:5px}#driveTools[hidden]{display:none}

#boostControl{
  --charge:100%;position:absolute;right:2.4%;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 166px);
  display:grid;align-content:center;justify-items:center;gap:2px;min-width:86px;height:48px;
  padding:4px 12px 7px;overflow:hidden;border:1px solid #f09d78;border-radius:10px;
  background:linear-gradient(135deg,rgba(116,42,24,.9),rgba(64,22,18,.92));color:#ffe2d1;
  pointer-events:auto;touch-action:none;user-select:none;box-shadow:0 8px 24px rgba(235,95,48,.28)
}
#boostControl b{font:italic 800 13px/1 Arial,sans-serif;letter-spacing:.08em}
#boostControl kbd{font:10px monospace;opacity:.85;margin-right:2px}
#boostReadout{font:10.5px/1.1 "Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
#boostControl:after{content:"";position:absolute;left:0;bottom:0;width:var(--charge);height:3px;background:linear-gradient(90deg,#ff8d54,#ffd478)}
#boostControl[data-phase=active]{background:linear-gradient(135deg,#c94322,#9e2816);color:#fff;border-color:#ffd8a6;box-shadow:0 0 26px rgba(255,124,62,.55)}
#boostControl[data-phase=cooldown]{background:rgba(20,34,42,.88);border-color:#687d84;color:#bdd0d4;box-shadow:none}
#boostControl:disabled{cursor:default;opacity:.82}

.count{position:absolute;top:29%;width:100%;text-align:center;font:900 italic clamp(66px,9vw,128px)/1 Arial,sans-serif;text-shadow:0 6px 40px rgba(0,22,32,.85)}
.alert{
  position:absolute;left:50%;bottom:18%;transform:translateX(-50%);
  background:rgba(12,28,38,.92);backdrop-filter:blur(10px);
  border:1px solid rgba(245,190,115,.45);border-left:3px solid #f5bb72;
  padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap;
  box-shadow:0 10px 28px rgba(0,0,0,.4)
}
.toast{
  position:absolute;z-index:16;left:50%;top:max(66px,env(safe-area-inset-top));transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:12px;
  background:linear-gradient(135deg,rgba(24,52,66,.95),rgba(14,30,42,.96));

.note{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);background:#142a34;padding:15px 22px;border-radius:9px;z-index:25;text-align:center}

  .touch-device .clusterCard{background:rgba(9,21,31,.62);border:1px solid rgba(175,216,224,.18);backdrop-filter:blur(8px);box-shadow:none;padding:5px 12px;gap:8px;border-radius:12px}
  .touch-device .gMeter{width:34px;height:34px}

</style></head><body><main id="app">
<canvas id="view" aria-label="三维赛车画面"></canvas>
<div class="shade" id="shade"></div>

<header>
