name: Build Android Release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'APK version name (e.g. 2.0.0)'
        required: false
        default: '2.0.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 35
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build and test web bundle
        run: |
          npm ci
          node --test
          npm run build

      - name: Build APK
        env:
          NORDRUN_KEYSTORE_B64: ${{ secrets.NORDRUN_KEYSTORE_B64 }}
          NORDRUN_KEY_PASSWORD: ${{ secrets.NORDRUN_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"
          if [ -n "${NORDRUN_KEYSTORE_B64}" ] && [ -n "${NORDRUN_KEY_PASSWORD}" ]; then
            echo "${NORDRUN_KEYSTORE_B64}" | base64 -d > /tmp/nordrun.keystore
            NORDRUN_KEYSTORE=/tmp/nordrun.keystore python3 android/build.py "Nordrun-${VERSION}.apk"
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            python3 android/build.py --debug "Nordrun-${VERSION}.apk"
            echo "SIGNED_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nordrun-apk-${{ env.APK_VERSION }}
          path: Nordrun-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="北环竞速 2.0 大版本更新：
          - 支持 **双通道在线更新**：应用内自动检查并一键在线热更新最新线上网页资源（无需重装 APK），同时保留新版 APK 整包更新。
          - 全新 GT 展厅车库与赛道遥测仪表 HUD（弧形速度环、实时 G 值球、8 色车漆涂装、4 档底盘调校）。
          - 地图引擎全面重构，新增 4 条赛道（秋名云海、碧海樱岬、霓虹都会、熔岩秘境），总计 9 条赛道，弯道配备路缘石与箭头牌。
          - 新增动态天气（晴朗/黄昏/暴雨/浓雾）、漂移大师模式与连击氮气充能、九城大满贯、12 项车手成就、安卓原生震动反馈。"
          if [ "${SIGNED_RELEASE}" != "true" ]; then
            NOTES="${NOTES}

          > 提示：本安装包采用全新签名构建，如手机上已安装旧版 1.6.1 请先卸载旧版后再安装 2.0.0；安装后即可享受内置线上热更新。"
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "Nordrun-${APK_VERSION}.apk" --clobber
            gh release edit "${GITHUB_REF_NAME}" --latest --notes "${NOTES}"
          else
            gh release create "${GITHUB_REF_NAME}" "Nordrun-${APK_VERSION}.apk" \
              --title "北环竞速 ${APK_VERSION} · 2.0 大改版与在线热更新" \
              --notes "${NOTES}" \
              --latest
          fi
